# Borra el PDF cifrado temporal si tiene más de 24 h. El equipo ya lo reemplaza al generar el
# siguiente informe (rama "datos" = un solo commit sin historia); esto cubre el caso de que no se
# genere otro informe en días.
name: Borrar PDF temporal de más de 24 h
on:
  schedule:
    - cron: "17 * * * *"   # cada hora
  workflow_dispatch:
permissions:
  contents: write
jobs:
  limpiar:
    runs-on: ubuntu-latest
    steps:
      - name: Borrar la rama datos si es vieja
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fecha=$(gh api "repos/$GITHUB_REPOSITORY/commits/datos" --jq .commit.committer.date 2>/dev/null) || { echo "No hay PDF temporal."; exit 0; }
          edad=$(( $(date +%s) - $(date -d "$fecha" +%s) ))
          echo "PDF temporal subido hace $edad s"
          if [ "$edad" -gt 86400 ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/datos"
            echo "Borrado."
          fi
